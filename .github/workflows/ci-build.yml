name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check documentation contracts
        run: npm run check:docs

      - name: Enforce documentation impact on pull requests
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_docs_consistency.py --changed-only --strict

      - name: Report documentation impact on direct pushes
        if: github.event_name == 'push'
        run: python3 scripts/check_docs_consistency.py --changed-only

  validate-web-settings-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Run settings-backup consistency check
        run: node openquatt/web/check-settings-backup.mjs

      - name: Install web build dependencies
        run: npm ci

      - name: Check generated web bundles
        env:
          OPENQUATT_WEB_BUNDLE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run check:web

      - name: Run web smoke checks
        run: npm run smoke:web

  host-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile and run host regression tests
        run: ./scripts/run_host_regression_tests.sh

  validate-and-compile:
    needs: [docs-consistency, validate-web-settings-backup, host-regression-tests]
    uses: ./.github/workflows/esphome-build.yml
    with:
      artifact_suffix: firmware-${{ github.sha }}
      include_firmware_bin: true
