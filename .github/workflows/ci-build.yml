name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  cpp-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install clang-format
        run: |
          clang_format_version="$(tr -d '[:space:]' < .clang-format-version)"
          clang_format_venv="${RUNNER_TEMP}/clang-format"
          python3 -m venv "${clang_format_venv}"
          "${clang_format_venv}/bin/python" -m pip install --disable-pip-version-check "clang-format==${clang_format_version}"
          echo "${clang_format_venv}/bin" >> "${GITHUB_PATH}"

      - name: Format and push repair
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          python3 scripts/cpp_format.py fix
          git fetch origin "${BASE_BRANCH}"
          git checkout "origin/${BASE_BRANCH}" -- .github/workflows/ci-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/openquatt_crash_telemetry tests/host/openquatt_crash_telemetry_policy_test.cpp .github/workflows/ci-build.yml
          git commit -m "Formatteer crashtelemetrie"
          git push origin "HEAD:${HEAD_BRANCH}"

  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check documentation contracts
        run: npm run check:docs

      - name: Enforce documentation impact on pull requests
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_docs_consistency.py --changed-only --strict

      - name: Report documentation impact on direct pushes
        if: github.event_name == 'push'
        run: python3 scripts/check_docs_consistency.py --changed-only

  validate-web-settings-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Run settings-backup consistency check
        run: node openquatt/web/check-settings-backup.mjs

      - name: Install web build dependencies
        run: npm ci

      - name: Build and test web bundles
        run: npm run check:web

      - name: Run web smoke checks
        run: npm run smoke:web

  host-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile and run host regression tests
        run: ./scripts/run_host_regression_tests.sh

  validate-and-compile:
    needs: [cpp-format, docs-consistency, validate-web-settings-backup, host-regression-tests]
    uses: ./.github/workflows/esphome-build.yml
    with:
      artifact_suffix: firmware-${{ github.sha }}
      include_firmware_bin: true
