# ==============================================================================
# OpenQuatt - Electropaultje Heatpump Listener / Duo / Wi-Fi
# ==============================================================================
substitutions:
  oq_hardware_profile: "heatpump_listener"
  oq_connection: "wifi"
  oq_topology_build_flag: "-DOQ_TOPOLOGY_DUO=1"
  main_release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/latest/download/openquatt-heatpump-listener-duo-wifi-ota.manifest.json"
  dev_release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/download/dev-latest/openquatt-heatpump-listener-duo-wifi-ota.manifest.json"
  release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/latest/download/openquatt-heatpump-listener-duo-wifi-ota.manifest.json"
  alternate_topology: "single"
  alternate_topology_main_release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/latest/download/openquatt-heatpump-listener-single-wifi-ota.manifest.json"
  alternate_topology_dev_release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/download/dev-latest/openquatt-heatpump-listener-single-wifi-ota.manifest.json"

esphome:
  build_path: ../../../.esphome/build/heatpump_listener_duo_wifi

packages:
  openquatt_substitutions_common: !include ../../openquatt/oq_substitutions_common_package.yaml
  openquatt_topology_duo_substitutions: !include ../../openquatt/topology/duo_package.yaml
  openquatt_profile_heatpump_listener: !include ../../openquatt/profiles/heatpump_listener.yaml
  openquatt_base_common: !include ../../openquatt/base/common.yaml
  openquatt_connection_wifi: !include ../../openquatt/connection/wifi.yaml
  oq_heatpump_listener_extras: !include ../../openquatt/profiles/heatpump_listener_extras.yaml
  openquatt_packages_common: !include ../../openquatt/oq_packages_common.yaml
  openquatt_topology_duo_packages: !include ../../openquatt/topology/duo_packages.yaml
