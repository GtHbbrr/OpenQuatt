  </text>
  <circle cx="215" cy="425" r="22" fill="#ea580c"/>
  <path d="M215 414v22m-8-8 8 8 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
