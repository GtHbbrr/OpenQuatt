<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 720" role="img" aria-labelledby="title desc">
  <title id="title">Stap 2: Modbus naar M1</title>
  <desc id="desc">Verplaats Modbus A, G en B van de CiC naar de primaire Modbuspoort M1.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #111827; }
    .kicker { font-size: 14px; font-weight: 850; letter-spacing: 1.2px; fill: #ea580c; }
    .title { font-size: 24px; font-weight: 820; letter-spacing: -.4px; }
    .map { font-size: 17px; font-weight: 850; }
    .copy { font-size: 15px; font-weight: 700; fill: #475569; }
  </style>
  <rect width="430" height="720" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="22" y="34" class="kicker">02 · BUITENUNITCOMMUNICATIE</text>
  <text x="22" y="70" class="title">Verplaats Modbus naar M1.</text>
  <text x="22" y="96" class="copy">M1 is de primaire poort voor de Quatt-buitenunit(s).</text>
