# ==============================================================================
# OpenQuatt – Auxiliary Relay Control
# ==============================================================================
#
# Goal:
#   Drive an optional auxiliary relay (for example HCQ relay R2) from the
#   effective OpenQuatt thermal decision, so external equipment such as a
#   fan coil, pump, valve or indication contact can follow heating/cooling.
#
# Role in architecture:
#   Owner of the auxiliary relay; observes the final supervisory Control Mode
#   and never influences heating/cooling control itself.
#
# What this package DOES do:
#   - Switch the auxiliary relay via the configured pin (`controller_aux_relay_pin`)
#   - Expose a persistent function selector (default: Disabled)
#   - Follow effective heating (CM2/CM3/CM4) and cooling (CM5) decisions,
#     including the CM1 pre/postflow destination mode
#   - Optionally wait for a suitable supply-water temperature (switch), with hysteresis
#   - Publish relay state and a short status/reason for diagnostics
#
# What this package DOES NOT do:
#   - Does not determine Control Mode or thermal demand
#   - Does not touch the boiler relay (R1) or any strategy/actuator logic
#   - Does not react to frost protection (CM98) or commissioning (CM100)
#
# Key assumptions:
#   - `oq_control_mode_code` and `oq_cm1_next_after` are the final system
#     decision (supervisory owner)
#   - `oq_system_supply_temp` is the shared supply-water abstraction; NaN means
#     no valid source and the supply-temperature gate must fail OFF
#   - Only hardware profiles that expose an auxiliary relay include this file
#
# Interaction with Control Modes:
#   - CM2/CM3/CM4 -> effective heating demand for the relay functions
#   - CM5 -> effective cooling demand for the relay functions
#   - CM1 -> follows the pre/postflow destination (CM2/CM4 heating, CM5 cooling)
#   - CM0/CM98/CM100 -> no thermal demand; relay OFF
#
# Safety / fail-safe:
#   - Relay restores ALWAYS_OFF and stays OFF until the control loop runs
#   - Disabled function or unknown/invalid state always results in OFF
#   - Supply-temperature gate fails OFF when supply temperature is unavailable
#   - Hysteresis latch prevents relay chatter around the thresholds
#
# ==============================================================================

# ----------------------------
# INTERNAL STATE
# ----------------------------
globals:
  # Water-temperature gate latch; only meaningful while a thermal mode is active.
  - id: oq_aux_temp_gate_on
    type: bool
    restore_value: false
    initial_value: 'false'

  # Last observed thermal mode (0=none, 1=cooling, 2=heating) to reset the latch.
  - id: oq_aux_relay_last_mode
    type: int
    restore_value: false
    initial_value: '0'

# ----------------------------
# OUTPUTS
# ----------------------------
output:
  - platform: gpio
    id: controller_aux_relay_out
    pin:
      number: ${controller_aux_relay_pin}
      # Strapping pin is only sampled at reset; the board wires the relay
      # driver here by design, so the warning is intentionally suppressed.
      ignore_strapping_warning: true

# ----------------------------
# ENTITIES
# ----------------------------
switch:
  - platform: output
    id: controller_aux_relay
    name: "Aux relay (R2)"
    internal: true
    disabled_by_default: true
    output: controller_aux_relay_out
    icon: mdi:electric-switch
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic

  - platform: template
    id: oq_aux_wait_for_supply_temp
    name: "Aux Relay Wait For Supply Temp"
    icon: mdi:thermometer-check
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: config

select:
  - platform: template
    id: oq_aux_relay_function
    name: "Aux Relay Function"
    icon: mdi:electric-switch
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Disabled
      - Heating demand
      - Cooling demand
      - Heating or cooling demand
    initial_option: Disabled

number:
  - platform: template
    id: oq_aux_heat_start_c
    name: "Aux Relay Heating Start Temp"
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 60
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 30
    entity_category: config

  - platform: template
    id: oq_aux_cool_start_c
    name: "Aux Relay Cooling Start Temp"
    icon: mdi:thermometer-chevron-down
    unit_of_measurement: "°C"
    min_value: 8
    max_value: 25
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 18
    entity_category: config

  - platform: template
    id: oq_aux_temp_hysteresis_c
    name: "Aux Relay Temp Hysteresis"
    icon: mdi:swap-vertical
    unit_of_measurement: "°C"
    min_value: 0.5
    max_value: 5
    step: 0.5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 2
    entity_category: config

# ----------------------------
# DIAGNOSTICS
# ----------------------------
binary_sensor:
  - platform: template
    id: oq_aux_relay_active
    name: "Aux relay active"
    icon: mdi:electric-switch
    device_class: running
    disabled_by_default: true
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: oq_aux_relay_status
    name: "Aux relay status"
    icon: mdi:information-outline
    disabled_by_default: true
    entity_category: diagnostic
    update_interval: never

# ----------------------------
# MAIN LOOP
# ----------------------------
interval:
  - interval: 5s
    startup_delay: 4800ms
    then:
      - lambda: |-
          // Phase 1: read inputs (final supervisory decision + configuration).
          const int cm_code = id(oq_control_mode_code);
          const int cm1_next_code = id(oq_cm1_next_after);
          // CM2/CM3/CM4 produce heat; CM5 cools. During CM1 pre/postflow the
          // destination mode counts, so equipment powered via R2 (for example
          // a circulation pump) is already available while flow is established.
          const bool heating_active =
              (cm_code == 2) || (cm_code == 3) || (cm_code == 4) ||
              (cm_code == 1 && (cm1_next_code == 2 || cm1_next_code == 4));
          const bool cooling_active =
              (cm_code == 5) ||
              (cm_code == 1 && cm1_next_code == 5);
          const std::string function_option =
              id(oq_aux_relay_function).has_state()
                  ? id(oq_aux_relay_function).current_option()
                  : std::string("Disabled");

          // Phase 2: decide desired relay state and status per function.
          bool relay_on = false;
          std::string status = "Disabled";
          const int mode_code = cooling_active ? 1 : (heating_active ? 2 : 0);
          if (mode_code != id(oq_aux_relay_last_mode)) {
            id(oq_aux_temp_gate_on) = false;
            id(oq_aux_relay_last_mode) = mode_code;
          }
          if (function_option == "Heating demand") {
            relay_on = heating_active;
            status = relay_on ? "Heating demand active" : "No heating demand";
          } else if (function_option == "Cooling demand") {
            relay_on = cooling_active;
            status = relay_on ? "Cooling demand active" : "No cooling demand";
          } else if (function_option == "Heating or cooling demand") {
            relay_on = heating_active || cooling_active;
            status = heating_active ? "Heating demand active"
                   : cooling_active ? "Cooling demand active"
                                    : "No thermal demand";
          }

          // Phase 2b: optional supply-temperature gate on top of the demand result.
          const bool gate_enabled = id(oq_aux_wait_for_supply_temp).state;
          if (!gate_enabled || !relay_on) {
            id(oq_aux_temp_gate_on) = false;
          } else {
            const float supply_c = id(oq_system_supply_temp).state;
            if (isnan(supply_c)) {
              // Fail OFF when no valid supply-water source is available.
              id(oq_aux_temp_gate_on) = false;
              status = "Supply temperature unavailable";
            } else {
              float hysteresis_c = id(oq_aux_temp_hysteresis_c).state;
              if (isnan(hysteresis_c)) hysteresis_c = 2.0f;
              if (mode_code == 2) {
                float start_c = id(oq_aux_heat_start_c).state;
                if (isnan(start_c)) start_c = 30.0f;
                if (supply_c >= start_c) id(oq_aux_temp_gate_on) = true;
                else if (supply_c <= start_c - hysteresis_c) id(oq_aux_temp_gate_on) = false;
                if (!id(oq_aux_temp_gate_on)) status = "Waiting for warm water";
              } else {
                float start_c = id(oq_aux_cool_start_c).state;
                if (isnan(start_c)) start_c = 18.0f;
                if (supply_c <= start_c) id(oq_aux_temp_gate_on) = true;
                else if (supply_c >= start_c + hysteresis_c) id(oq_aux_temp_gate_on) = false;
                if (!id(oq_aux_temp_gate_on)) status = "Waiting for cold water";
              }
            }
            relay_on = id(oq_aux_temp_gate_on);
          }

          // Phase 3: apply relay state only on change to avoid relay chatter.
          if (relay_on && !id(controller_aux_relay).state) {
            ESP_LOGI("quatt.aux_relay", "Aux relay ON: %s", status.c_str());
            id(controller_aux_relay).turn_on();
          } else if (!relay_on && id(controller_aux_relay).state) {
            ESP_LOGI("quatt.aux_relay", "Aux relay OFF: %s", status.c_str());
            id(controller_aux_relay).turn_off();
          }

          // Phase 4: publish diagnostics on change.
          if (!id(oq_aux_relay_active).has_state() || id(oq_aux_relay_active).state != relay_on) {
            id(oq_aux_relay_active).publish_state(relay_on);
          }
          static std::string last_status = "";
          if (status != last_status) {
            id(oq_aux_relay_status).publish_state(status);
            last_status = status;
          }
