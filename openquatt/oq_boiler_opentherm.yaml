# ==============================================================================
# OpenQuatt – OpenTherm Boiler (OTB) master, transport and telemetry
# ==============================================================================
#
# Q-hardware-only OpenTherm master. CH follows only the centrally validated
# BoilerCommand output request while this transport is selected. DHW permission
# remains enabled so OpenQuatt does not disable normal tap-water operation.
# ==============================================================================

esphome:
  on_shutdown:
    priority: 700
    then:
      - lambda: |-
          // Best-effort normal shutdown handshake. Hard power loss remains
          // inherently fail-silent because no OpenTherm requests are sent.
          id(oq_otb_ch_enable).turn_off();
          auto call = id(oq_otb_t_set_command).make_call();
          call.set_value(0.0f);
          call.perform();
          id(oq_boiler_transport_active) = false;

globals:
  - id: oq_otb_last_response_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_otb_response_count
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_otb_last_response_id
    type: int
    restore_value: false
    initial_value: '-1'

  - id: oq_otb_link_initialized
    type: bool
    restore_value: false
    initial_value: 'false'

opentherm:
  - id: oq_otb_hub
    in_pin: ${oq_ot_boiler_in_pin}
    out_pin: ${oq_ot_boiler_out_pin}
    # The runtime switch is default-off and owns the actual STATUS bit. The hub
    # gate must be true or ESPHome would mask that switch permanently.
    ch_enable: true
    dhw_enable: true
    cooling_enable: false
    otc_active: false
    ch2_active: false
    summer_mode_active: false
    dhw_block: false
    before_process_response:
      then:
        - lambda: |-
            // Called only after the hub accepted a complete OpenTherm response.
            id(oq_otb_last_response_ms) = millis();
            id(oq_otb_response_count)++;
            id(oq_otb_last_response_id) = x.id;

number:
  - platform: opentherm
    opentherm_id: oq_otb_hub
    t_set:
      id: oq_otb_t_set_command
      name: "OTB - Control Setpoint Command"
      internal: true
      entity_category: diagnostic
      icon: mdi:thermostat
      min_value: 0
      max_value: 90
      step: 0.1
      initial_value: 0
      restore_value: false

switch:
