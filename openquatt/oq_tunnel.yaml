# ==============================================================================
# OpenQuatt - Stateless HTTP Reverse Proxy Tunnel (Cloudflare Tunnel Client)
# ==============================================================================

external_components:
  - source:
      type: local
      path: "${external_components_path}"
    components: [openquatt_tunnel]

# Dit dwingt de generator om de websocket include-paden globaal open te stellen
esp32:
  framework:
    advanced:
      include_builtin_idf_components:
        - esp_websocket_client

openquatt_tunnel:
  id: openquatt_tunnel_service
  relay_host: "${oq_tunnel_relay_host}"
  pump_secret: "${oq_tunnel_pump_secret}"
