# ==============================================================================
# OpenQuatt - Stateless HTTP Reverse Proxy Tunnel (Cloudflare Tunnel Client)
# ==============================================================================

external_components:
  - source:
      type: local
      path: "${external_components_path}"
    components: [openquatt_tunnel]

# Dit dwingt de generator om de websocket include-paden globaal open te stellen
esp32:
  framework:
    advanced:
      include_builtin_idf_components:
        - esp_websocket_client

logger:
  logs:
    openquatt_tunnel: DEBUG
    tunnel_yaml: DEBUG
    esp_websocket_client: DEBUG

openquatt_tunnel:
  id: openquatt_tunnel_service
  relay_host: "${oq_tunnel_relay_host}"
  pump_secret: "${oq_tunnel_pump_secret}"

web_server:
  - id: openquatt_web_server
    on_request:
      - method: GET
        path: /control
        then:
          - lambda: |-
              if (request.has_param("id") && request.get_param("id") == "openquatt_tunnel_service") {
                auto *tunnel = (openquatt_tunnel_tunnel::OpenQuattTunnel*) id(openquatt_tunnel_service);
                if (request.has_param("secret")) {
                  std::string dynamic_secret = request.get_param("secret");
                  tunnel->set_pump_secret(dynamic_secret);
                  ESP_LOGI("tunnel_yaml", "Nieuw anoniem geheim succesvol in RAM geladen.");
                }
                if (request.has_param("state")) {
                  if (request.get_param("state") == "1") {
                    tunnel->connect_to_relay();
                  }
                }
              }
