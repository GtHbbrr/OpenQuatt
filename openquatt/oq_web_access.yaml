# OpenQuatt Core Web Access & Proxy Environment Integration

external_components:
  - source:
      type: local
      path: "${external_components_path}"
    components: [web_server, web_server_base, openquatt_web_auth, openquatt_recovery, openquatt_trends, openquatt_energy_history, openquatt_log_history, openquatt_debug_recorder, openquatt_entities, openquatt_service_status, openquatt_mqtt_config, openquatt_decision_log, openquatt_incident_manager, openquatt_odu_eeprom_dump, openquatt_odu_runtime_frequency, openquatt_odu_settings, openquatt_tunnel]

# Dit activeert en linkt de native framework compiler-paden van de websocket client voor de core array
esp32:
  framework:
    advanced:
      include_builtin_idf_components:
        - esp_websocket_client
