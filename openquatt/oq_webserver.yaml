# ==============================================================================
# OpenQuatt – Stateless Proxy Webserver Configuration
# ==============================================================================
# Goal: Configure the authenticated web application to support remote access
# over a stateless HTTP-over-WebSocket tunnel proxy to Cloudflare.
# ==============================================================================

substitutions:
  # Static templates for the Cloudflare matching infrastructure (Section 3 & 8)
  oq_tunnel_relay_host: "quatt.openheatpumps.nl"
  oq_tunnel_pump_secret: "dev_placeholder_secret"

# 1. External Infrastructure Components (v2026.9.0 local path registration)
external_components:
  - source:
      type: local
      path: ../../components
    components:
      - oq_tunnel

web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: ${web_auth_bootstrap_username}
    password: ${web_auth_bootstrap_password}
  css_include: ${oq_webserver_css_include}
  js_include: ${oq_webserver_js_include}
  js_url: "${oq_webserver_js_url}"

# 2. Binary stateless HTTP-over-WebSocket tunnel engine
oq_tunnel:
  id: openquatt_tunnel_service
  relay_host: ${oq_tunnel_relay_host}
  pump_secret: ${oq_tunnel_pump_secret}

# 3. Control & Helper blocks (The anonymous activation mechanism)
switch:
  - platform: template
    name: "Stateless Remote Ingress"
    id: oq_proxy_external_access
    icon: "mdi:tunnel"
    optimistic: true
    turn_on_action:
      - lambda: |-
          // Phase 1: Signal the core service to initialize connection
          ESP_LOGI("oq_webserver", "Activating anonymous outbound proxy pipeline...");
          // Future expansion path for client pairing flow will hook here
    turn_off_action:
      - lambda: |-
          // Phase 1: Immediately drop socket handles and clear transients
          ESP_LOGW("oq_webserver", "Revoking remote access, dropping active routes.");
