# Test-only Heatpump Controller Q / Duo / Wi-Fi firmware.
# Never add this config to build_targets.yaml: every button deliberately crashes
# or stalls the controller.

packages:
  oq_crash_test_base: !include ../../configs/heatpump_controller_q/duo_wifi.yaml

esphome:
  build_path: ../../.esphome/build/hil_crash_telemetry_q_duo_wifi

openquatt_crash_telemetry:
  release_manifest_url: ""

text_sensor:
  - platform: template
    id: oq_hil_crash_state
    name: "HIL crash telemetry state"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 1s
    lambda: |-
      char state[96];
      snprintf(state, sizeof(state), "pending=%u consent_seen=%u consent_enabled=%u persisted_known=%u persisted_enabled=%u",
               id(oq_crash_telemetry).has_pending_record() ? 1U : 0U,
               id(oq_crash_telemetry).has_observed_consent() ? 1U : 0U,
               id(oq_crash_telemetry).is_consent_enabled() ? 1U : 0U,
               id(oq_crash_telemetry).has_persisted_consent() ? 1U : 0U,
               id(oq_crash_telemetry).is_persisted_consent_enabled() ? 1U : 0U);
      return {state};

button:
  - platform: template
    id: oq_hil_crash_abort
    name: "HIL crash: abort"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          std::abort();

  - platform: template
    id: oq_hil_crash_invalid_write
    name: "HIL crash: invalid pointer write"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          auto *invalid = reinterpret_cast<volatile uint32_t *>(static_cast<uintptr_t>(0x1U));
          *invalid = 0x4F514849U;

  - platform: template
    id: oq_hil_crash_loop_watchdog
    name: "HIL crash: loop watchdog"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          for (;;) {
            asm volatile("nop");
          }
